{% extends 'base.html' %}{% block content %}<section class="scanner"><p class="eyebrow">GATE SCANNER · {{user.gate or 'ALL GATES'}}</p><h1>Validate admission</h1><div id="result" role="status" aria-live="polite"></div><form id="scan"><label>Fixture<select name="event_id">{% for e in events %}<option value="{{e.id}}">{{e.title}}</option>{% endfor %}</select></label><label>QR token or ticket number<input name="token" required autofocus autocomplete="off" placeholder="Scan QR or enter ticket number"></label><button id="submit">Validate ticket</button></form>
<div class="camera-actions"><button type="button" id="photo">Take QR photo</button><label class="button secondary">Upload QR image<input id="upload" type="file" accept="image/*" capture="environment" hidden></label></div><div id="camera" hidden><video id="preview" playsinline></video><button type="button" id="capture">Capture QR</button><button type="button" class="secondary" id="closeCamera">Close camera</button></div><p id="cameraHelp">Camera starts only when requested. HTTPS or trusted localhost is required; manual entry and keyboard-wedge scanners remain available.</p></section>
<script>
const form=document.querySelector('#scan'), output=document.querySelector('#result'), input=form.elements.token, submit=document.querySelector('#submit'), camera=document.querySelector('#camera'), video=document.querySelector('#preview');let stream=null,busy=false;
function message(title,detail,kind='invalid'){output.className='scan-result '+kind;output.replaceChildren(Object.assign(document.createElement('strong'),{textContent:title}),Object.assign(document.createElement('span'),{textContent:detail||''}));}
async function validate(value){if(busy)return;busy=true;submit.disabled=true;input.value=value;try{const response=await fetch('/gate/scan',{method:'POST',body:new FormData(form)});if(response.status===401){message('SESSION EXPIRED','Sign in again.');return}if(!response.ok)throw Error('Server returned '+response.status);const data=await response.json();message(data.result,data.detail,data.result==='VALID'?'valid':data.result==='WRONG ENTRANCE'?'warn':'invalid');input.value='';input.focus()}catch(error){message('NETWORK / SCAN FAILURE','Admission was not recorded. Check the connection and retry.')}finally{busy=false;submit.disabled=false}}
form.addEventListener('submit',event=>{event.preventDefault();validate(input.value.trim())});
async function decode(source){if(!('BarcodeDetector'in window)){message('DECODER UNAVAILABLE','This browser has no QR image decoder. Use manual entry or a keyboard-wedge scanner.');return}try{const detector=new BarcodeDetector({formats:['qr_code']}),codes=await detector.detect(source);if(codes.length===0)message('UNREADABLE QR','Retake the photo in good light.');else if(codes.length>1)message('MULTIPLE CODES','Photograph one ticket only.');else if(!codes[0].rawValue)message('EMPTY QR','No ticket payload was found.');else validate(codes[0].rawValue.trim())}catch(error){message('UNREADABLE IMAGE','Choose a clear QR photograph and retry.')}}
async function stop(){if(stream)stream.getTracks().forEach(track=>track.stop());stream=null;video.srcObject=null;camera.hidden=true}
document.querySelector('#photo').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;camera.hidden=false;await video.play()}catch(error){message('CAMERA UNAVAILABLE','Permission was refused, no camera exists, or HTTPS is required. You can upload an image or enter the ticket number.')}};
document.querySelector('#capture').onclick=()=>{const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);decode(canvas)};document.querySelector('#closeCamera').onclick=stop;
document.querySelector('#upload').onchange=async event=>{const file=event.target.files[0];if(!file)return;if(file.size>8*1024*1024){message('IMAGE TOO LARGE','Choose an image smaller than 8 MB.');return}try{const bitmap=await createImageBitmap(file);await decode(bitmap);bitmap.close()}catch(error){message('MALFORMED IMAGE','Choose a valid image file.')}event.target.value=''};addEventListener('pagehide',stop);
</script>{% endblock %}
