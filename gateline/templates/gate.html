{% extends 'base.html' %}{% block content %}<section class="scanner"><p class="eyebrow">GATE SCANNER · {{user.gate or 'ALL GATES'}}</p><h1>Scan supporter ticket</h1><div id="result"></div><form id="scan"><label>Match<select name="event_id">{% for e in events %}<option value="{{e.id}}">{{e.title}}</option>{% endfor %}</select></label><label>QR token<input name="token" required autofocus autocomplete="off" placeholder="Scan or enter ticket token"></label><button>Validate ticket</button></form><p>Camera scanning can be used with a compatible keyboard-wedge QR scanner. No customer details are shown.</p></section><script>scan.onsubmit=async(e)=>{e.preventDefault();let r=await fetch('/gate/scan',{method:'POST',body:new FormData(scan)}),d=await r.json();result.className='scan-result '+(d.result==='VALID'?'valid':d.result==='WRONG ENTRANCE'?'warn':'invalid');result.innerHTML='<strong>'+d.result+'</strong><span>'+d.detail+'</span>';scan.token.value='';scan.token.focus()}</script>{% endblock %}
