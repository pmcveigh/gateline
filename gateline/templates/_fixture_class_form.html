<form method="post" action="/admin/events/{{event.id}}/ticket-types" class="grid admin-form"><input type="hidden" name="class_id" value="{{tc.id if tc else 0}}"><label>Name<input name="name" value="{{tc.name if tc else ''}}" maxlength="100" required></label><label>Price (£)<input name="price" type="number" value="{{tc.price if tc else ''}}" min="0" step="0.01" required></label><label>Description<input name="description" value="{{tc.description if tc else ''}}"></label><label>Audience<select name="audience"><option value="home" {{'selected' if not tc or tc.audience=='home'}}>Home</option><option value="away" {{'selected' if tc and tc.audience=='away'}}>Away</option></select></label><label>Section<select name="section_id"><option value="">All sections for this audience</option>{% for inv in event.inventories %}<option value="{{inv.section_id}}" {{'selected' if tc and tc.section_id==inv.section_id}}>{{inv.section.name}}</option>{% endfor %}</select></label><label>Maximum per booking<input type="number" name="maximum" value="{{tc.maximum if tc else 10}}" min="0" max="10"></label><label>Concession under<input type="number" name="concession_under" value="{{tc.concession_under if tc else 16}}" min="0" max="120"></label><label>Concession over<input type="number" name="concession_over" value="{{tc.concession_over if tc else 65}}" min="0" max="120"></label><label class="checkbox-label"><input name="adult" type="checkbox" value="true" {{'checked' if tc and tc.adult_admission}}>Adult admission</label><label class="checkbox-label"><input name="enabled" type="checkbox" value="true" {{'checked' if not tc or tc.enabled}}>Enabled</label><button class="wide">Save ticket type</button></form>
