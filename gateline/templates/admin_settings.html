{% extends 'base.html' %}{% block content %}<h1>Admin account settings</h1>{% if error %}<p class="form-error">{{error}}</p>{% endif %}{% if request.query_params.get('saved') %}<p class="pricing-saved">Password changed.</p>{% endif %}<form class="auth" method="post"><p>{{user.name}} · {{user.email}}</p><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label><label>Confirm password<input type="password" name="confirmation" autocomplete="new-password" required></label><button>Change password</button></form>{% endblock %}
