{% extends 'base.html' %}{% block content %}<div class="checkout"><p class="eyebrow">SUPPORTER PORTAL</p><h1>Create an account</h1>{% if error %}<p class="form-error" role="alert">{{error}}</p>{% endif %}<form method="post" class="grid"><label>Full name<input name="full_name" value="{{form.get('full_name','')}}" required maxlength="120" autocomplete="name"></label><label>Username<input name="username" value="{{form.get('username','')}}" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_.\-]+" autocomplete="username"></label><label>Email<input type="email" name="email" value="{{form.get('email','')}}" required autocomplete="email"></label><label>Date of birth<input type="date" name="birth_date" value="{{form.get('birth_date','')}}" required autocomplete="bday"><small>Used to check ticket eligibility on match day.</small></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmation" required minlength="8" autocomplete="new-password"></label><fieldset class="wide"><legend>Clubs you follow</legend><div class="interest-grid">{% for club in clubs %}<label class="checkbox-label"><input type="checkbox" name="clubs" value="{{club}}" {{'checked' if club in form.get('clubs',[])}}>{{club}}</label>{% endfor %}</div></fieldset><button class="wide">Create account</button></form><p>Already registered? <a href="/account/login">Sign in</a></p></div>{% endblock %}
