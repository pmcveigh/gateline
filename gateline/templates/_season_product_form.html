<form method="post" action="/admin/clubs/{{quote(club.name,safe='')}}/season-products" class="grid admin-form"><input type="hidden" name="product_id" value="{{product.id if product else 0}}"><label>Title<input name="title" value="{{product.title if product else ''}}" maxlength="200" required></label><label>Section<input name="section" value="{{product.section if product else ''}}" maxlength="100" required></label><label>Ticket type<input name="ticket_type" value="{{product.ticket_type if product else 'Adult'}}" maxlength="100" required></label><label>Competition<input name="competition" value="{{product.competition if product else 'NIFL Premiership'}}" required></label><label>Valid from<input type="date" name="valid_from" value="{{product.valid_from if product else ''}}" required></label><label>Valid until<input type="date" name="valid_until" value="{{product.valid_until if product else ''}}" required></label><label>Price (£)<input name="price" type="number" min="0" step="0.01" value="{{product.price if product else ''}}" required></label><label>Capacity<input name="capacity" type="number" min="1" value="{{product.capacity if product else 100}}" required></label><label>Concession under<input name="concession_under" type="number" value="{{product.concession_under if product else 16}}" min="0" max="120"></label><label>Concession over<input name="concession_over" type="number" value="{{product.concession_over if product else 65}}" min="0" max="120"></label><label class="checkbox-label"><input name="enabled" type="checkbox" value="true" {{'checked' if product and product.enabled}}>Available to existing supporters in the app</label><button class="wide">{{'Save product' if product else 'Create product'}}</button></form>
