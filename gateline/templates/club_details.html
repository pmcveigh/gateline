{% extends 'base.html' %}{% block content %}{% include '_club_nav.html' %}<h1>{{club.display_name}} details</h1>{% if error %}<p class="form-error" role="alert">{{error}}</p>{% endif %}{% if request.query_params.get('saved') %}<p class="pricing-saved">Club details saved.</p>{% endif %}<form method="post" class="grid admin-form"><label>Display name<input name="display_name" value="{{club.display_name}}" maxlength="150" required></label><label>Short name<input name="short_name" value="{{club.short_name}}" maxlength="30" required></label><label>Contact email<input name="contact_email" value="{{club.contact_email}}" type="email"></label><label>Primary colour<input name="primary_colour" value="{{club.primary_colour}}" type="color"></label><label class="wide">Club address<textarea name="address" maxlength="1000">{{club.address}}</textarea></label><label class="wide">Description<textarea name="description" maxlength="3000">{{club.description}}</textarea></label><label>Default venue<select name="venue_id"><option value="">Not set</option>{% for v in venues %}<option value="{{v.id}}" {{'selected' if v.id==club.venue_id}}>{{v.name}}</option>{% endfor %}</select></label><button class="wide">Save club details</button></form>{% endblock %}
