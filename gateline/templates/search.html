{% extends 'base.html' %}{% block content %}<h1>Search</h1><form class="search"><input name="q" value="{{q}}" placeholder="Name, email, order or ticket ID"><button>Search</button></form><h2>Orders</h2>{% for o in orders %}<p><b>{{o.reference}}</b> · {{o.customer.full_name}} · {{o.customer.email}}</p>{% endfor %}<h2>Tickets</h2>{% for t in tickets %}<p><a href="/tickets/{{t.public_id}}">{{t.public_id}}</a> · {{t.status}}</p>{% endfor %}{% endblock %}
