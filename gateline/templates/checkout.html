{% extends 'base.html' %}{% block content %}<div class="checkout"><section><p class="eyebrow">SECURE CHECKOUT</p><h1>Your details</h1><p>Your tickets for <b>{{event.title}}</b> are held for 10 minutes.</p><form method="post" class="grid"><label>Full name<input name="full_name" required></label><label>Email address<input name="email" type="email" required></label><label>Address line 1<input name="address1" required></label><label>Address line 2<input name="address2"></label><label>Town/city<input name="city" required></label><label>Postcode<input name="postcode" required></label><label>Country<input name="country" value="United Kingdom" required></label><label>Ticket class<select name="class_id">{% for c in event.classes %}<option value="{{c.id}}">{{c.name}} — £{{'%.2f'|format(c.price)}}</option>{% endfor %}</select></label><label>Season-ticket number<input name="priority_code"></label><label>Voucher code<input name="voucher_code"></label><label>Test payment<select name="test_result"><option value="success">Approve test payment</option><option value="fail">Decline test payment</option></select></label><button class="wide">Complete test payment</button></form></section></div>{% endblock %}
